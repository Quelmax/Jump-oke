<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JUMP-OKÊ - Catálogo e Fila</title>
  
  <!-- React e Tailwind -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase V8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@400;600;700&display=swap');
    body { background-color: #F3EBD4; font-family: 'Inter', sans-serif; }
    .font-brand { font-family: 'Pacifico', cursive; color: #3AADD9; }
    .bg-brand { background-color: #3AADD9; }
    .text-brand { color: #3AADD9; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const SongListItem = ({ song, isExpanded, onToggle, onAddToQueue }) => (
      <div className="bg-white rounded-lg shadow-sm mb-3 overflow-hidden transition-all duration-300">
        <div onClick={onToggle} className="p-4 flex items-center justify-between cursor-pointer hover:bg-gray-50">
          <div className="flex-1 pr-4">
            <h3 className="font-bold text-gray-800 text-lg leading-tight">{song.titulo}</h3>
            <p className="text-sm text-gray-500 mt-1">{song.artista}</p>
          </div>
          <div className="flex items-center gap-3">
            <span className="bg-gray-100 text-gray-700 font-bold px-3 py-1 rounded-full text-sm">{song.tom_original}</span>
            <i data-lucide={isExpanded ? "chevron-up" : "chevron-down"} className="text-gray-400"></i>
          </div>
        </div>
        
        {isExpanded && (
          <div className="p-4 border-t border-gray-100 bg-gray-50/50">
            <div className="flex flex-wrap gap-2 mb-4">
              {song.tags.map((tag, index) => (
                <span key={index} className="text-xs text-brand bg-blue-50 border border-blue-100 px-2 py-1 rounded-md">{tag}</span>
              ))}
            </div>
            <div className="flex gap-2">
              <a href={song.caminho_drive} target="_blank" rel="noopener noreferrer" className="flex-1 bg-gray-200 text-gray-700 text-center py-3 rounded-lg font-semibold hover:bg-gray-300 transition-colors shadow-sm flex justify-center items-center gap-2">
                Ver Cifra
              </a>
              <button onClick={() => onAddToQueue(song)} className="flex-1 bg-brand text-white text-center py-3 rounded-lg font-semibold hover:bg-blue-400 transition-colors shadow-sm flex justify-center items-center gap-2">
                <i data-lucide="mic" className="w-4 h-4"></i> Pedir Música
              </button>
            </div>
          </div>
        )}
      </div>
    );

    const App = () => {
      const [songs, setSongs] = useState([]);
      const [queue, setQueue] = useState([]);
      const [loading, setLoading] = useState(true);
      const [activeTab, setActiveTab] = useState('search'); 
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedArtist, setSelectedArtist] = useState(null);
      const [azFilter, setAzFilter] = useState('Todos');
      const [expandedSongId, setExpandedSongId] = useState(null);
      const [visibleCount, setVisibleCount] = useState(50);
      const [db, setDb] = useState(null);

      // Dados de exemplo
      const mockData = [
        { id: 1, titulo: "A Cruz Vazia", artista: "Kleber Lucas", genero: "Gospel", tom_original: "F#", tags: ["Adoração", "4/4", "Anos 2000"], caminho_arquivo: "", caminho_drive: "#" },
        { id: 2, titulo: "Deus de Promessas", artista: "Davi Sacer", genero: "Gospel", tom_original: "G", tags: ["Louvor"], caminho_arquivo: "", caminho_drive: "#" },
        { id: 3, titulo: "1000 Graus", artista: "Renascer Praise", genero: "Gospel", tom_original: "Em", tags: ["Agitada"], caminho_arquivo: "", caminho_drive: "#" }
      ];

      useEffect(() => {
        // COLE SUAS CHAVES DO FIREBASE AQUI
        const firebaseConfig = {
          apiKey: "AIzaSyCHwO56jd9RsozoGBycp2m9DRTuI4ZxBgw",
          authDomain: "gen-lang-client-0482031825.firebaseapp.com",
          projectId: "gen-lang-client-0482031825",
          storageBucket: "gen-lang-client-0482031825.firebasestorage.app",
          messagingSenderId: "538452063756",
          appId: "1:538452063756:web:b58b8a0c085edd758ba029",
          measurementId: "G-W2Q5BW8NBP"
        };

        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        const firestoreDb = firebase.firestore();
        setDb(firestoreDb);

        const unsubscribe = firestoreDb.collection('fila').orderBy('timestamp', 'asc')
          .onSnapshot(snapshot => {
            const filaAtualizada = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            setQueue(filaAtualizada);
          });

        // Simulação de carregamento (Remova e use o fetch abaixo no GitHub)
        //setTimeout(() => { setSongs(mockData); setLoading(false); }, 800);

      const cachedData = localStorage.getItem('catalogoJumpOke');

        if (cachedData) {
          // Carrega da memória do celular (Não gasta banda)
          setSongs(JSON.parse(cachedData));
          setLoading(false);
        } else {
          // Baixa do Firebase apenas na primeira vez
          fetch('https://firebasestorage.googleapis.com/v0/b/gen-lang-client-0482031825.firebasestorage.app/o/catalogo.json?alt=media')
            .then(res => res.json())
            .then(data => {
              localStorage.setItem('catalogoJumpOke', JSON.stringify(data));
              setSongs(data);
              setLoading(false);
            })
            .catch(err => console.error("Erro ao carregar catálogo", err));
        }
                      

        return () => unsubscribe();
      }, []);

      useEffect(() => { lucide.createIcons(); });

      const resetView = () => { setVisibleCount(50); setExpandedSongId(null); };
      const normalizeText = (text) => text.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
      const alphabet = ['Todos', '#', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')];

      const handleAddToQueue = (song) => {
        const cantor = prompt(`Quem vai cantar "${song.titulo}"?`);
        if (cantor && cantor.trim() !== "" && db) {
          db.collection('fila').add({
            cantor: cantor,
            musica: song.titulo,
            artista: song.artista,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          }).then(() => {
            alert("Música adicionada à fila!");
            setActiveTab('queue');
          });
        }
      };

      const handleTabChange = (tab) => { setActiveTab(tab); resetView(); };

      const searchResults = useMemo(() => {
        if (!searchTerm) return [];
        const term = normalizeText(searchTerm);
        return songs.filter(song => normalizeText(song.titulo).includes(term) || normalizeText(song.artista).includes(term) || song.tags.some(tag => normalizeText(tag).includes(term))).slice(0, visibleCount);
      }, [songs, searchTerm, visibleCount]);

      const artistsList = useMemo(() => [...new Set(songs.map(s => s.artista))].sort((a, b) => a.localeCompare(b)), [songs]);
      const artistSongs = useMemo(() => songs.filter(s => s.artista === selectedArtist).slice(0, visibleCount), [songs, selectedArtist, visibleCount]);
      
      const azResults = useMemo(() => {
        let filtered = songs.sort((a, b) => a.titulo.localeCompare(b.titulo));
        if (azFilter !== 'Todos') {
          filtered = filtered.filter(song => {
            const firstLetter = normalizeText(song.titulo.charAt(0)).toUpperCase();
            return azFilter === '#' ? !/^[A-Z]$/.test(firstLetter) : firstLetter === azFilter;
          });
        }
        return filtered.slice(0, visibleCount);
      }, [songs, azFilter, visibleCount]);

      if (loading) return <div className="min-h-screen flex items-center justify-center font-brand text-5xl animate-pulse">Jump</div>;

      return (
        <div className="max-w-md mx-auto min-h-screen pb-20">
          <header className="sticky top-0 z-50 pt-6 pb-4 px-4 shadow-sm" style={{ backgroundColor: '#F3EBD4' }}>
            <h1 className="font-brand text-5xl text-center mb-6">Jump</h1>
            <div className="flex overflow-x-auto hide-scrollbar bg-white/60 rounded-xl p-1 shadow-sm border border-white/50 gap-1">
              <button onClick={() => handleTabChange('search')} className={`flex-shrink-0 px-4 py-2 text-sm font-bold rounded-lg ${activeTab === 'search' ? 'bg-white text-brand shadow-sm' : 'text-gray-500'}`}>🔎 Buscar</button>
              <button onClick={() => handleTabChange('artists')} className={`flex-shrink-0 px-4 py-2 text-sm font-bold rounded-lg ${activeTab === 'artists' ? 'bg-white text-brand shadow-sm' : 'text-gray-500'}`}>🎤 Artistas</button>
              <button onClick={() => handleTabChange('az')} className={`flex-shrink-0 px-4 py-2 text-sm font-bold rounded-lg ${activeTab === 'az' ? 'bg-white text-brand shadow-sm' : 'text-gray-500'}`}>🎵 A-Z</button>
              <button onClick={() => handleTabChange('queue')} className={`flex-shrink-0 px-4 py-2 text-sm font-bold rounded-lg ${activeTab === 'queue' ? 'bg-white text-brand shadow-sm' : 'text-gray-500'}`}>📺 Fila</button>
            </div>
          </header>

          <main className="p-4">
            
            {/* ABA: BUSCA */}
            {activeTab === 'search' && (
              <div className="animate-fade-in">
                <input type="text" placeholder="Música, artista ou tag..." className="w-full bg-white rounded-xl py-4 px-4 mb-6 shadow-sm focus:ring-2 outline-none font-medium text-gray-700" value={searchTerm} onChange={(e) => {setSearchTerm(e.target.value); resetView();}} />
                {searchTerm === '' ? (
                  <p className="text-center text-gray-500 mt-10">Digite algo para encontrar sua música</p>
                ) : (
                  <div>
                    {searchResults.map((song) => <SongListItem key={song.id} song={song} isExpanded={expandedSongId === song.id} onToggle={() => setExpandedSongId(expandedSongId === song.id ? null : song.id)} onAddToQueue={handleAddToQueue} />)}
                    {searchResults.length >= visibleCount && <button onClick={() => setVisibleCount(prev => prev + 50)} className="w-full py-3 mt-4 bg-white text-gray-700 font-bold rounded-lg shadow-sm border border-gray-200">Carregar mais...</button>}
                  </div>
                )}
              </div>
            )}

            {/* ABA: ARTISTAS */}
            {activeTab === 'artists' && (
              <div className="animate-fade-in">
                {!selectedArtist ? (
                  <div className="grid grid-cols-1 gap-2">
                    {artistsList.map((artist, idx) => (
                      <button key={idx} onClick={() => setSelectedArtist(artist)} className="bg-white p-4 rounded-xl shadow-sm text-left font-bold text-gray-700 flex justify-between items-center hover:bg-gray-50">
                        {artist} <i data-lucide="chevron-right" className="text-gray-300 w-5 h-5"></i>
                      </button>
                    ))}
                  </div>
                ) : (
                  <div>
                    <button onClick={() => setSelectedArtist(null)} className="mb-4 text-brand font-bold flex items-center gap-1"><i data-lucide="arrow-left" className="w-4 h-4"></i> Voltar</button>
                    <h2 className="text-2xl font-bold text-gray-800 mb-4">{selectedArtist}</h2>
                    {artistSongs.map((song) => <SongListItem key={song.id} song={song} isExpanded={expandedSongId === song.id} onToggle={() => setExpandedSongId(expandedSongId === song.id ? null : song.id)} onAddToQueue={handleAddToQueue} />)}
                    {artistSongs.length >= visibleCount && <button onClick={() => setVisibleCount(prev => prev + 50)} className="w-full py-3 mt-4 bg-white font-bold rounded-lg shadow-sm border border-gray-200">Carregar mais...</button>}
                  </div>
                )}
              </div>
            )}

            {/* ABA: A-Z */}
            {activeTab === 'az' && (
              <div className="animate-fade-in">
                <div className="flex gap-2 overflow-x-auto hide-scrollbar pb-2 mb-4">
                  {alphabet.map((letter) => (
                    <button key={letter} onClick={() => { setAzFilter(letter); resetView(); }} className={`flex-shrink-0 px-4 py-2 rounded-lg font-bold ${azFilter === letter ? 'bg-brand text-white shadow-md' : 'bg-white text-gray-500 border border-gray-200'}`}>{letter}</button>
                  ))}
                </div>
                {azResults.map((song) => <SongListItem key={song.id} song={song} isExpanded={expandedSongId === song.id} onToggle={() => setExpandedSongId(expandedSongId === song.id ? null : song.id)} onAddToQueue={handleAddToQueue} />)}
                {azResults.length >= visibleCount && <button onClick={() => setVisibleCount(prev => prev + 50)} className="w-full py-3 mt-4 bg-white font-bold rounded-lg shadow-sm border border-gray-200">Carregar mais...</button>}
              </div>
            )}

            {/* ABA: FILA */}
            {activeTab === 'queue' && (
              <div className="animate-fade-in">
                <h2 className="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                  <span className="w-3 h-3 rounded-full bg-red-500 animate-pulse"></span> Fila Atual
                </h2>
                {queue.length === 0 ? (
                  <p className="text-center text-gray-500 mt-10">A fila está vazia. Seja o primeiro a pedir!</p>
                ) : (
                  <div className="flex flex-col gap-3">
                    {queue.map((item, index) => (
                      <div key={item.id} className="bg-white p-4 rounded-xl shadow-sm border-l-4 border-[#3AADD9] flex items-center gap-4">
                        <div className="bg-gray-100 text-gray-500 font-bold w-8 h-8 rounded-full flex items-center justify-center shrink-0">{index + 1}</div>
                        <div>
                          <p className="font-bold text-gray-800 text-lg leading-tight">{item.cantor}</p>
                          <p className="text-sm text-gray-500">cantando <strong>{item.musica}</strong></p>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
            
          </main>
        </div>
      );
    };
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
